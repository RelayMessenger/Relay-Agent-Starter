name: CI

on:
  push:
    branches: [staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, test, and Worker dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated types
        run: npm run types:check

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Worker dry run
        run: npm run dry-run
